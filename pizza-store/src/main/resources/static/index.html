<!DOCTYPE html>
<html>

<head>
    <title>Cloud Native - Pizza Store</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css"
        integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u" crossorigin="anonymous">
    <link href="main.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.1.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
    <script src="app.js"></script>
</head>

<body onload="connect()">
    <noscript>
        <h2 style="color: #ff0000">Seems your browser doesn't support Javascript! Websocket relies on Javascript being
            enabled. Please enable
            Javascript and reload this page!</h2>
    </noscript>
    <header>
        <div class="pizza-place">
            <h2>Cloud Native Pizza Store</h2>
            <h4><a href="https://github.com/salaboy/pizza">github.com/salaboy/pizza</a></h4>
        </div>
        <div class="pizza-order">
            <h5>Order Id:</h5>
            <div class="pizza-item">
                <input id="orderId"></input>
            </div>
        </div>
        <div class="pizza-order">
            <h5>Place order:</h5>
            <div>
                <p>Pepperoni</p>
                <button id="pepperoni-add">Add 🍕</button>
            </div>
            <div>
                <p>Vegetarian</p>
                <button id="vegetarian-add">Add 🥒</button>
            </div>
            <div>
                <p>Diet Cocke</p>
                <button id="dietcoke-add">Add 🥤</button>
            </div>
            <div>
                <p>Beer</p>
                <button id="beer-add">Add 🍺</button>
            </div>
            <div id="bag">

            </div>
            <button id="placeOrder" class="button main" type="submit">Place Order</button>
            <button id="emptyCart" class="button main" type="submit">Empty Cart</button>
        </div>
        <div class="pizza-order">
            <h5>Type your order</h5>
            <p></p>
            <div class="pizza-item">
                <textarea id="prompt" rows="5"></textarea>
            </div>
            <button id="placeOrderPrompt" class="button main" type="submit">Sent prompt</button>
        </div>

    </header>
    <div id="main-content" class="container">
        <div class="row">
            <div class="col-md-6">
                <h2>Order Status</h2>
                <div class="">
                    <div id="status">

                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <h2>Events</h2>
                <div class="">
                    <div id="events">

                    </div>
                </div>
            </div>
        </div>

    </div>
</body>

</html>
