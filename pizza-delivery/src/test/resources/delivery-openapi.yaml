openapi: 3.0.2
info:
  title: Pizza Delivery API
  version: 1.0.0
  description: This API allows to start the delivery of pizzas
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
paths:
  /deliver:
    put:
      operationId: startDelivery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Order'
            examples:
              salaboy:
                value: |-
                  {
                    "id": "abc-def-ghi",
                    "customer": {
                      "name": "salaboy",
                      "email": "salaboy@mail.com"
                    },
                    "items": [
                      {
                      "name":"pepperoni",
                      "category": "pizza",
                      "amount": 1
                      }
                    ],
                    "orderDate": 1738142460555,
                    "workflowId": "abc-edf"
                  }
              lbroudoux:
                value:
                  id: 123-456-789
                  customer:
                    name: lbroudoux
                    email: laurent.broudoux@gmail.com
                  items:
                    - name: vegetarian
                      category: pizza
                      amount: 1
                  orderDate: 1738142460556
                  workflowId: "jkl-iop"
      responses:
        '200':
          description: Delivery started
          x-microcks-refs:
            - salaboy
            - lbroudoux
components:
  schemas:
    Order:
      type: object
      properties:
        id:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        orderDate:
          type: number
        workflowId:
          type: string
      required:
        - id
        - items
        - orderDate
        - workflowId
      additionalProperties: true
    OrderItem:
      type: object
      properties:
        name:
          type: string
        category:
          type: string
        amount:
          type: integer
      required:
        - name
        - category
        - amount