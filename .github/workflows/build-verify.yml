name: build-verify-package
on:
  push:
    paths-ignore:
      #- '.github/**'
      - '.gitignore'
      - 'LICENSE'
      - '*.md'
  pull_request:
    paths-ignore:
      - '.github/**'
      - '.gitignore'
      - 'LICENSE'
      - '*.md'
permissions: read-all

jobs:
  build-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up JDK 17 for x64
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          java-version: '17'
          distribution: 'temurin'
          architecture: x64
          cache: maven

      - name: Pull container images we need
        run: |
          docker pull confluentinc/cp-kafka:7.5.0
          docker pull daprio/daprd:1.16.0
          docker pull daprio/placement:1.16.0
          docker pull daprio/scheduler:1.16.0
          docker pull quay.io/microcks/microcks-uber:1.12.1-native

      - name: Build Kitchen Java component
        run: |
          cd ${{github.workspace}}/pizza-kitchen
          mvn -B clean verify

      - name: Build Delivery Java component
        run: |
          cd ${{github.workspace}}/pizza-delivery
          mvn -B clean verify

      - name: Build Store Java component
        run: |
          cd ${{github.workspace}}/pizza-store
          mvn -B clean verify
