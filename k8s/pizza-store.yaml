apiVersion: apps/v1
kind: Deployment
metadata:
  name: pizza-store-deployment
spec:
  selector:
    matchLabels:
      app: pizza-store-service
  template:
    metadata:
      annotations:
        dapr.io/app-id: pizza-store
        dapr.io/app-port: "8080"
        dapr.io/enabled: "true"
        dapr.io/log-level: "debug"
        dapr.io/config: "tracing"
        dapr.io/sidecar-image: kaspernissen/daprd:tracing-v9-linux-arm64-linux-arm64
        dapr.io/env: "OTEL_SERVICE_NAME=pizza-store-daprd"
        instrumentation.opentelemetry.io/inject-java: "opentelemetry/instrumentation"
      labels:
        app: pizza-store-service
        app.kubernetes.io/name: pizza-store-service
        app.kubernetes.io/part-of: pizza-store-service
        app.kubernetes.io/version: 0.1.0
    spec:
      containers:
      - name: pizza-store-service
        #image: salaboy/pizza-store:1.0.14-agentic-amd64
        image: kaspernissen/pizza-store:1.0.14-agentic-tracing-v8-arm64
        imagePullPolicy: Always
        env:
        - name: SERVER_PORT
          value: "8080"
        - name: PUBLIC_IP
          value: localhost:8080
        - name: STATESTORE_NAME
          value: kvstore
        - name: DAPR_GRPC_ENDPOINT
          value: http://localhost:50001
        - name: DAPR_HTTP_ENDPOINT
          value: http://localhost:3500
        - name: OPENAI_API_KEY
          value: <YOUR OPENAI_API_KEY HERE>
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
        resources:
          limits:
            cpu: "1"
            memory: "2Gi"
          requests:
            cpu: "1"
            memory: "2Gi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: pizza-store
spec:
  selector:
    app: pizza-store-service
  ports:
  - port: 80
    targetPort: 8080